[project]
name = "computernetworkrag"
version = "0.1.0"
description = "计算机网络课程智能问答演示系统：知识图谱 + RAG 问答 + ReAct 智能体，单进程零外部服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-openai>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "lightrag-hku>=1.3.0",
    "python-docx>=1.1",
    "dnspython>=2.6",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.32",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "aiofiles>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
