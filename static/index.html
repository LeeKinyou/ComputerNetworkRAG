<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算机网络课程智能问答系统</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="https://registry.npmmirror.com/vue/3.4.38/files/dist/vue.global.prod.js"></script>
  <script>window.Vue || document.write('<script src="/assets/lib/vue.global.prod.js"><\/script>');</script>
  <script src="https://registry.npmmirror.com/echarts/5.5.1/files/dist/echarts.min.js"></script>
  <script>window.echarts || document.write('<script src="/assets/lib/echarts.min.js"><\/script>');</script>
</head>
<body>
  <div id="app" v-cloak>
    <header class="topbar">
      <div class="brand">计算机网络课程智能问答系统</div>
      <nav class="tabs">
        <button v-for="t in tabs" :key="t.key" class="tab"
                :class="{ active: currentView === t.key }" @click="go(t.key)">{{ t.label }}</button>
      </nav>
      <div class="health" :title="healthTitle">
        <span class="dot" :class="healthClass"></span>{{ healthText }}
      </div>
    </header>
    <main class="main">
      <div class="view-wrap">
        <overview-view v-show="currentView === 'overview'"></overview-view>
        <graph-view v-show="currentView === 'graph'"></graph-view>
        <rag-view v-show="currentView === 'rag'"></rag-view>
        <agent-view v-show="currentView === 'agent'"></agent-view>
        <library-view v-show="currentView === 'library'"></library-view>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/components/graph-view.js"></script>
  <script src="/assets/js/components/source-card.js"></script>
  <script src="/assets/js/components/timeline.js"></script>
  <script src="/assets/js/views/overview.js"></script>
  <script src="/assets/js/views/graph.js"></script>
  <script src="/assets/js/views/rag.js"></script>
  <script src="/assets/js/views/agent.js"></script>
  <script src="/assets/js/views/library.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
