<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="40" y="45" font-size="15" font-weight="600" fill="#1F2430">以太网 V2 帧结构</text>
  <text x="40" y="66" font-size="11" fill="#7A8394">单位：字节（Byte）　数据字段不足 46 字节时用填充字段补齐</text>

  <g font-size="11" fill="#3C4454" text-anchor="middle">
    <rect x="45" y="96" width="70" height="46" fill="#F1F3F6" stroke="#D6DCE8"/>
    <text x="80" y="117">前导码</text>
    <text x="80" y="133" font-size="10" fill="#8A93A4">7</text>

    <rect x="115" y="96" width="22" height="46" fill="#F1F3F6" stroke="#D6DCE8"/>
    <text x="126" y="123" font-size="9">SFD</text>

    <rect x="137" y="96" width="80" height="46" fill="#EAF0FE" stroke="#C7D3EE"/>
    <text x="177" y="117">目的 MAC</text>
    <text x="177" y="133" font-size="10" fill="#7A8394">6</text>

    <rect x="217" y="96" width="80" height="46" fill="#EAF0FE" stroke="#C7D3EE"/>
    <text x="257" y="117">源 MAC</text>
    <text x="257" y="133" font-size="10" fill="#7A8394">6</text>

    <rect x="297" y="96" width="48" height="46" fill="#FFF3E2" stroke="#EAD3B0"/>
    <text x="321" y="117">类型</text>
    <text x="321" y="133" font-size="10" fill="#8A7346">2</text>

    <rect x="345" y="96" width="280" height="46" fill="#EAF7F0" stroke="#BFE0CE"/>
    <text x="485" y="115">数据字段</text>
    <text x="485" y="133" font-size="10" fill="#5F7F6C">46 ~ 1500</text>

    <rect x="625" y="96" width="90" height="46" fill="#F3EAFE" stroke="#D9C4EE"/>
    <text x="670" y="117">FCS</text>
    <text x="670" y="133" font-size="10" fill="#7A618F">4</text>
  </g>

  <line x1="45" y1="158" x2="715" y2="158" stroke="#C9D0DD" stroke-width="1"/>
  <text x="45" y="178" font-size="10" fill="#7A8394">帧头 14 字节（目的 MAC + 源 MAC + 类型）</text>
  <text x="415" y="178" font-size="10" fill="#7A8394">帧尾 4 字节（FCS 校验）</text>

  <rect x="45" y="205" width="670" height="86" rx="12" fill="#F8FAFE" stroke="#DCE3F1"/>
  <text x="66" y="232" font-size="12" font-weight="600" fill="#2F4D8F">为什么数据字段最小是 46？</text>
  <text x="66" y="254" font-size="11" fill="#4A5364">最小帧长 64 字节 = 6 + 6 + 2 + 46 + 4。10 Mbps 共享式以太网的最远往返传播时延为 51.2 μs，</text>
  <text x="66" y="272" font-size="11" fill="#4A5364">发送方必须持续发送至少 512 bit（64 字节）才能在自己仍在发送时检测到冲突。</text>
</svg>
