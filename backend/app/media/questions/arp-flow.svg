<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="40" y="45" font-size="15" font-weight="600" fill="#1F2430">同一局域网内的 ARP 解析</text>
  <text x="40" y="66" font-size="11" fill="#7A8394">主机 A 想发数据给 192.168.1.20，但缓存里没有它的 MAC 地址</text>

  <rect x="45" y="120" width="150" height="76" rx="12" fill="#F8FAFE" stroke="#D6DEEF"/>
  <text x="120" y="150" font-size="12" font-weight="600" fill="#1F2430" text-anchor="middle">主机 A</text>
  <text x="120" y="170" font-size="10" fill="#7A8394" text-anchor="middle">192.168.1.10</text>
  <text x="120" y="186" font-size="10" fill="#7A8394" text-anchor="middle">MAC: 00:1A:2B:00:00:0A</text>

  <rect x="330" y="130" width="100" height="66" rx="33" fill="#F4F6FA" stroke="#D6DEEF"/>
  <text x="380" y="159" font-size="11" fill="#6B7484" text-anchor="middle">以太网</text>
  <text x="380" y="176" font-size="11" fill="#6B7484" text-anchor="middle">共享介质</text>

  <rect x="565" y="120" width="150" height="76" rx="12" fill="#F8FAFE" stroke="#D6DEEF"/>
  <text x="640" y="150" font-size="12" font-weight="600" fill="#1F2430" text-anchor="middle">主机 B</text>
  <text x="640" y="170" font-size="10" fill="#7A8394" text-anchor="middle">192.168.1.20</text>
  <text x="640" y="186" font-size="10" fill="#7A8394" text-anchor="middle">MAC: 00:1A:2B:3C:4D:5E</text>

  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3A6BE0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2E9E6B"/>
    </marker>
  </defs>

  <path d="M195,142 C250,110 300,110 330,142" stroke="#3A6BE0" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M430,142 C470,110 520,110 565,142" stroke="#3A6BE0" stroke-width="2" fill="none" marker-end="url(#arrowBlue)" stroke-dasharray="5 4"/>
  <text x="248" y="98" font-size="10" fill="#3A6BE0" text-anchor="middle">① 广播请求</text>

  <path d="M565,178 C520,212 470,212 430,178" stroke="#2E9E6B" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M330,178 C300,212 250,212 195,178" stroke="#2E9E6B" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="380" y="232" font-size="10" fill="#2E9E6B" text-anchor="middle">② 单播响应</text>

  <rect x="45" y="252" width="670" height="66" rx="12" fill="#F8FAFE" stroke="#DCE3F1"/>
  <text x="66" y="276" font-size="11" fill="#4A5364">请求：谁是 192.168.1.20？目的 MAC = FF:FF:FF:FF:FF:FF（广播，同网段所有主机都收到）</text>
  <text x="66" y="298" font-size="11" fill="#4A5364">响应：我是 192.168.1.20，我的 MAC 是 00:1A:2B:3C:4D:5E（单播，只回给请求方，同时双方更新 ARP 缓存）</text>
</svg>
