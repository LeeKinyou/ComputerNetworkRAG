<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="40" y="45" font-size="15" font-weight="600" fill="#1F2430">拥塞窗口 cwnd 的变化</text>
  <text x="40" y="66" font-size="11" fill="#7A8394">慢启动阶段每收到一个 ACK 加 1，约每个 RTT 翻倍；到达 ssthresh 后转为线性增长</text>

  <line x1="70" y1="280" x2="710" y2="280" stroke="#C9D0DD" stroke-width="1"/>
  <line x1="70" y1="60" x2="70" y2="280" stroke="#C9D0DD" stroke-width="1"/>
  <text x="64" y="284" font-size="9" fill="#8A93A4" text-anchor="end">0</text>
  <text x="64" y="224" font-size="9" fill="#8A93A4" text-anchor="end">4</text>
  <text x="64" y="164" font-size="9" fill="#8A93A4" text-anchor="end">8</text>
  <text x="64" y="104" font-size="9" fill="#8A93A4" text-anchor="end">12</text>
  <text x="64" y="70" font-size="9" fill="#8A93A4" text-anchor="end">16</text>

  <line x1="70" y1="164" x2="710" y2="164" stroke="#EAD3B0" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="700" y="158" font-size="9.5" fill="#8A6A32" text-anchor="end">ssthresh = 8</text>

  <polyline points="70,268 120,256 170,232 220,184 270,172 320,160 370,148 420,136"
            fill="none" stroke="#3A6BE0" stroke-width="2.2"/>
  <polyline points="420,136 470,268 520,256 570,232 620,184"
            fill="none" stroke="#2E9E6B" stroke-width="2.2" stroke-dasharray="6 4"/>

  <circle cx="420" cy="136" r="4" fill="#C2413B"/>
  <text x="430" y="126" font-size="9.5" fill="#C2413B">超时 / 3 个重复 ACK</text>

  <text x="160" y="212" font-size="10" fill="#3A6BE0">慢启动（指数增长）</text>
  <text x="470" y="196" font-size="10" fill="#2E7A55">拥塞避免（线性增长）</text>

  <text x="75" y="306" font-size="10" fill="#7A8394">横轴：RTT 轮次　纵轴：拥塞窗口 cwnd（MSS）</text>
  <text x="440" y="306" font-size="10" fill="#7A8394">超时后 ssthresh 降为当前 cwnd 的一半，cwnd 回到 1</text>
</svg>
